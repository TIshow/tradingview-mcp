# ---------------------------------------------------------------
# 期待値の宣言（開始時に書いておく。3ヶ月目に失速しないため）
# ---------------------------------------------------------------
expectations:
  purpose: |
    この5戦略は「勝つための戦略」ではない。新しい候補を測るための基準線である。
    探索期間（2016-2023）の実測では5種すべてがベンチマーク（ユニバース等ウェイト）に負け、
    5種すべてが位相不変性テストで脆いと判定され、
    5種すべてがランダム選択の分布（コスト0）の上位20〜55%に留まった。
    つまり銘柄選択の情報を示していない。それを承知の上で開始コホートとして凍結する。
  year_one_success_criterion: |
    1年目の成果は「市場に勝ったか」ではなく【汚染のない記録が存在すること】。
    年間の観測は約250件で、穏当な優位性の統計的検出には数年かかる。
  expected_outcome: |
    5戦略ともベンチマークを下回ることが最も確からしい予測である。
    それが起きた場合、これは失敗ではなく【探索期間の測定がフォワードで再現された】という結果になる。
  falsification: |
    探索期間の結論（＝情報なし）と食い違う結果が出た場合、まず記録側の欠陥を疑う。
    データ源・執行時刻・コスト計上を先に検査してから、戦略の実力を論じる。
