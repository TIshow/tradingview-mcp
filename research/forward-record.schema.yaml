# フォワード記録（人工投資家）— スキーマ定義
#
# 未来に向けた記録は、定義上アウトオブサンプルであり汚染が構造的に消える。
# ただしそれが成立するのは「結果が出る前に、書き換え不能な形で記録された場合」に限る。
#
# 実体:
#   research/forward/signals/YYYY-MM-DD.yaml   その日のシグナル（寄り前に確定・push）
#   research/forward/results/YYYY-MM-DD.yaml   約定と成績（大引け後に追記）
#   research/forward/strategy-set.yaml         固定された戦略集合（開始時に凍結）
#
# 参照: docs/research-protocol.md §12

# ---------------------------------------------------------------
# 1. 戦略集合（記録開始時に凍結。以後は毎回すべてを報告する）
# ---------------------------------------------------------------
strategy_set:
  frozen_at:              # 凍結日時
  contract_id:            # 準拠する研究契約
  strategies:
    - strategy_id:
      name:
      code_hash:          # 実装の同定
      added_at:           # 開始時からのものか、途中追加か
      cohort:             # 開始コホート | 追加コホート（別集計にする）
      economic_rationale:
  # 途中で戦略を追加する場合、追加日を記録し追加分は別集計にする。
  # 「後から一番良かったものを紹介する」のは過去でやったのと同じ多重検定。

# ---------------------------------------------------------------
# 2. 日次シグナル（寄り前に確定させ、その日のうちに push する）
# ---------------------------------------------------------------
signal_record:
  date:
  generated_at:           # 生成時刻（ISO8601・タイムゾーン必須）
  market_open_at:         # この時刻より前に生成されていること
  data_version:           # 参照したデータのバージョン/ハッシュ
  code_version:           # git commit hash

  signals:
    - strategy_id:
      symbol:
      direction:          # long | short | flat
      weight:             # ポートフォリオ比率
      reference_price:    # 判断時点の参照価格
      stop_loss:          # 決定論的コードが決める（LLMではない）
      rationale:          # 短い。事後に書き換えない

  # 外部の証人（不変性の担保）
  witness:
    pushed_at:            # GitHub のサーバ側タイムスタンプ
    commit_sha:
    published_url:        # 寄り前の公開投稿があれば（最も強い証拠）

# ---------------------------------------------------------------
# 3. 結果（大引け後に追記。シグナル部分は絶対に書き換えない）
# ---------------------------------------------------------------
result_record:
  date:
  fills:
    - strategy_id:
      symbol:
      fill_price:
      commission:
      slippage:           # 保守側に見積もる
      notes:
  daily_pnl:
    - strategy_id:
      gross_return:
      net_return:         # コスト控除後。これが正
  benchmark:
    buy_and_hold:
    index:                # 例: TOPIX / 日経225
  cumulative:
    - strategy_id:
      net_return_since_inception:
      max_drawdown:
      n_days:

# ---------------------------------------------------------------
# 4. 負けた理由 — 「結論」ではなく「子仮説」として登録する
# ---------------------------------------------------------------
# LLMは負けた後ならいくらでももっともらしい説明を作れる。
# 週次レポートが「洞察に見える作り話」になる典型的な失敗経路。
loss_analysis:
  date:
  strategy_id:
  candidate_causes:
    - hypothesis_id:      # registry に derivation: autopsy_child として登録
      description:
      status: unverified  # unverified | verified | refuted
      verification_plan:  # 以後のどのデータで、どう判定するか
  # レポートには「原因はこうだった」ではなく
  # 「原因の候補はこれで、まだ検証されていない」と書く。

# ---------------------------------------------------------------
# 5. 不変条件（記録側で強制する）
# ---------------------------------------------------------------
invariants:
  - signals は generated_at < market_open_at でなければ無効
  - signal_record は一度 push したら書き換えない。訂正は別レコードで追記する
  - 全戦略を毎回報告する。一部だけの報告を禁止する
  - 途中追加の戦略は cohort を分け、開始コホートと混ぜて集計しない
  - 成績は必ず net（コスト控除後）とベンチマーク比較を併記する
  - 原因説明は status: unverified で記録し、検証されるまで結論として扱わない

# ---------------------------------------------------------------
# 6. 期待値の宣言（最初に書いておく）
# ---------------------------------------------------------------
# 年間の観測は約250件。穏当な優位性の統計的検出には数年かかる。
# 1年目の成果は「市場に勝ったか」ではなく「汚染のない記録が存在すること」。
# これを最初に宣言しないと、3ヶ月目に「効果が見えない」と感じて失速する。
