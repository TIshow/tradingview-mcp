  # =============================================================
  - dataset_id: same_day_quotes_yfinance
    source: Yahoo Finance（yfinance 1.3.0 / 生の chart API も利用可）
    retrieved_at: 2026-08-13
    purpose: フォワード記録の当日シグナル生成のみ。履歴研究には使わない

    # --- 実測で確認した性質 ---
    price_point_in_time: false
      # ★ Close は分割を遡って反映した値。その日実際についた値段ではない。
      #   実測: 5801 の 2026-05-21 は Yahoo=4,928 に対し J-Quants 生値=49,280（後の1:10分割を遡及適用）。
      #   なお Yahoo の値は J-Quants の AdjC（調整後）と完全一致した。齟齬ではなく定義の違い。
    universe_survivorship_free: false
      # ★ 上場廃止銘柄は取得できない。実測: 6201.T が "possibly delisted" で取得失敗。
    corporate_actions_point_in_time: false
    same_day_available: true          # ★ これが唯一かつ決定的な利点
    timezone_verified: true

    performance:
      throughput: "約50ms/銘柄（一括・並列）。674銘柄で約35秒"
      comparison: "TradingView は 5〜10秒/銘柄（674銘柄で1〜2時間）→ 100〜200倍速い"

    cross_check:
      vs_jquants: "上位10銘柄の終値を照合。9件が完全一致、1件は上記の分割調整による定義差"
      vs_tradingview: "8306 の 2026-08-13 終値 3,709 で一致"

    allowed_claims:
      - forward-looking same-day signal generation
    forbidden_claims:
      - historical backtesting                   # 分割の遡及適用でPIT性が壊れる
      - historical stock-selection performance   # 上場廃止銘柄が欠落する
      - point-in-time price level analysis       # 「当時◯円だった」という主張は不可

    known_limitations:
      - "非公式APIであり、利用規約と安定性は保証されない"
      - "履歴研究には使えない。J-Quants の生値を使うこと"

