# 新しいデータ源を追加するとき必ず通す検証
verification_protocol:
  - 1〜3銘柄を複数ソースから取得し、同じ日の終値を照合する
    （TradingView の生バーは scripts/dump_bars.js で出力できる。照合の基準に使う）
  - 分割・配当のあった銘柄で調整の扱いを確認する
  - 上場廃止銘柄が取得できるか確認する（ここで survivorship_free が決まる）
  - タイムゾーンと取引時間を確認する
  - 上記の結果をこのレジストリに記録してから、量を増やす

# 順序の原則: データが正しいことを確認してから量を増やす。逆にすると全部やり直しになる。


