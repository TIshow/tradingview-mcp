# Data Bias Registry — データ汚染を機械可読にする
#
# 完全な point-in-time は達成目標ではなく「測定対象」。
# 汚染箇所を記録し、結論の射程を機械的に制限する。
#   「知らずに汚染される」と「汚染を知った上で射程を狭める」は全く別物。
#
# 判定装置は forbidden_claims に該当する結論を出した実験を自動棄却する。
# 参照: docs/research-protocol.md §4

datasets:
  # =============================================================
  # 日本株：J-Quants API V2（JPX公式）— 2026-08-12 実測で確認
  # =============================================================
  - dataset_id: jp_equity_daily_jquants_v2
    source: J-Quants API V2 (JPX公式)
    endpoint_base: https://api.jquants.com
    auth: x-api-key ヘッダー（キーは .env の JQUANTS_API。リポジトリには入れない）
    plan: Free
    retrieved_at: 2026-08-12
    version_hash: TBD   # 実データ取得時に記録

    # --- 実測で確認した性質 ---
    price_point_in_time: true
      # 生値(O/H/L/C)と調整後(AdjO/AdjH/AdjL/AdjC)の両方が返る。
      # 調整後は事後改訂されるため、PIT厳密性が要る場合は【生値】を使い、
      # 判断時点までの AdjFactor のみを累積適用すること。
    corporate_actions_point_in_time: partial
      # AdjFactor が行ごとに付与される。分割・併合は追跡可能。
      # 配当の扱いは未検証 → 要確認（TBD）
    universe_survivorship_free: true
      # ★実測: /v2/equities/master?date=YYYYMMDD で当時の構成銘柄が取得できる。
      #   2024-06-03 時点 4,358 銘柄 vs 現在 4,446 銘柄。
      #   当時あって現在ない銘柄が 265 件 = 上場廃止銘柄を再現できる。
      #   → 生存者バイアスを回避できる。銘柄選択に関する主張が可能になる。
    fundamentals_as_reported: unknown     # 本データセットは価格のみ。財務は別エンドポイント（未検証）
    announcement_timestamp_quality: not_applicable   # 価格データのため
    timezone_verified: true               # 日足・JST・日付のみ
    trading_hours_verified: not_applicable
    symbol_change_handled: unknown        # コード変更の追跡可否は未検証（TBD）
    missing_data_policy: unknown          # 欠損の扱いは未検証（TBD）

    # --- 利用可能な項目 ---
    fields:
      - "Date, Code(5桁), O/H/L/C（生値）"
      - "AdjO/AdjH/AdjL/AdjC, AdjFactor, AdjVo（調整後）"
      - "Vo（出来高）, Va（売買代金）← 流動性条件に直接使える"
      - "MktCap（時価総額）"
      - "UL/LL（ストップ高安フラグ）, ExRT"
    endpoints:
      master: "/v2/equities/master?date=YYYYMMDD   # 当時の構成銘柄（survivorship対応）"
      daily:  "/v2/equities/bars/daily?code=83060&from=YYYYMMDD&to=YYYYMMDD"

    # --- ★ 最大の制約（契約の期間分割に直結）---
    coverage_start: 2024-05-21
    coverage_end: 2026-05-21
      # Freeプランは【直近2年】かつ【約12週間の遅延】。
      # 2026-08-12 時点で 2026-05-21 までしか取得できない。
    universe_rule: |
      判定日時点で上場しており、直近20営業日の平均売買代金が10億円以上の全銘柄。
      /v2/equities/master?date=YYYYMMDD で当時の上場銘柄を取得し、Va でフィルタする。
      実測（2026-05-21 単日）: 10億円以上=674銘柄 / 3億円以上=1,193 / 全体=4,229。
      日付だけ指定すれば全銘柄を1リクエストで取得できる（code 省略可）。
    critical_limitations:
      - "履歴が2年しかない。契約の期間3分割（探索/調整/封印）が窮屈になる"
      - "約12週間の遅延があるため【フォワード記録の日次シグナルには使えない】。
         人工投資家には別の当日データ源が必要（TradingView / 他API）"
      - "レート制限あり。連続リクエストで 'Rate limit exceeded'。スロットル必須"

    allowed_claims:
      - fixed-universe price-pattern research
      - historical stock-selection performance   # ★survivorship-free のため解禁
      - liquidity-filtered universe research     # Va（売買代金）が取得可能
      # 前提: ユニバースを「その日時点で上場し、売買代金10億円以上」というルールで定義すること。
      #       手で選んだ銘柄リストを使う場合、この許可は無効になる（選択バイアスが入るため）。
    forbidden_claims:
      - fundamental announcement reaction        # 発表時刻の精度が未検証
      - intraday execution assumptions           # 日足のみ
      - real-time or same-day signals            # 約12週間の遅延があるため

    verified_by: 実測（/v2/equities/master の日付指定差分、/v2/equities/bars/daily の範囲取得）
    verification_notes: |
      2026-08-12 実施。
      - master 現在4,446件 / 2024-06-03時点4,358件、差分265件が上場廃止 → survivorship-free を確認
      - bars/daily は from/to の範囲指定が有効
      - 範囲外の日付は HTTP 400 で利用可能期間を明示して返す
      - 未検証: 配当調整の扱い / コード変更の追跡 / 欠損の扱い / 正確なレート制限値

  # =============================================================
  # 日本株の主データセット：yfinance 10年 — 2026-08-14 取得
  # =============================================================
  - dataset_id: jp_equity_daily_yfinance_v1
    source: Yahoo Finance（yfinance）
    retrieved_at: 2026-08-14
    version_hash: "af617742ab79c1063e5ba85763318e7252f3dc13fd267838676de1809b55f321"   # data/jp/manifest.json の symbols ハッシュ
    storage: "data/jp/daily/<ticker>.json.gz（生OHLCVのみ・50.8MB） / data/jp/manifest.json（git管理）"

    coverage_start: 2016-01-04
    coverage_end: 2026-08-13
    symbols: 1188
    total_bars: 2872813
    universe_source: "scripts/data/universe-jp.json（J-Quants で売買代金3億円以上・1,193銘柄を母集団として選定）"

    # --- 実測で確認した性質 ---
    price_point_in_time: false
      # Close は分割を遡及適用した値。実測: 5801 の 2026-05-21 は yf=4,928 に対し
      # J-Quants 生値=49,280（後の1:10分割）。J-Quants の AdjC とは完全一致した。
      # 他4銘柄は生値と完全一致しており、分割のない銘柄では問題ない。
    universe_survivorship_free: false
      # ★ 上場廃止銘柄は取得できない。実測: 1,193銘柄中5件が取得不能
      #   （6201 豊田自動織機・7189 西日本FH・6173 アクアライン 等 = TOB/廃止）
      #   母集団自体も「現在上場している銘柄」から作られているため、
      #   過去に上場していて今は無い銘柄は最初から含まれていない。
    corporate_actions_point_in_time: false
    same_day_available: true          # 当日データが取れる（J-Quants の12週遅延と対照的）
    timezone_verified: true
    missing_data_policy: "取得失敗した銘柄はマニフェストに含めない（欠損として扱う）"

    cross_check:
      vs_jquants: "2026-05-21 の終値を5銘柄で照合。分割のあった5801以外の4件は生値と完全一致"
      integrity: "全1,188銘柄の sha256 をマニフェストと照合し一致（--verify）"

    allowed_claims:
      - fixed-universe price-pattern research
      - relative comparison between strategies   # 同一ユニバースなのでバイアスが相殺される
      - regime-stability analysis                # 10年あるためレジーム間の安定性を検定できる
    forbidden_claims:
      - historical stock-selection performance   # 生存者バイアス（廃止銘柄が欠落）
      - point-in-time price level analysis       # 分割の遡及適用で「当時◯円」が言えない
      - absolute historical return claims        # 「年率◯%だった」は主張できない

    known_limitations:
      - "最終日が古い銘柄が3件（2036/3681/7940）。期間中の廃止と思われる"
      - "1,013銘柄（85%）は2016年から全期間あり。残り175銘柄はそれ以降の新規上場"
      - "★データ破損が存在する。値幅制限を超える変動を含む銘柄を品質ゲートで除外している"

    data_quality_gate:
      rule: "1日の変動が ±150% を超える銘柄は除外する（日本株の値幅制限を超えるため、未調整の分割か配信エラー）"
      implementation: "scripts/lib/dataset.js の dropCorrupt()"
      excluded_2016_2023: 5      # 1,145銘柄中 0.4%
      examples:
        - "8303.T SBI新生銀行 2023-09-27: 2,798 → 55,319,998,464（+1,977,126,364%）明白な破損"
        - "1326.T 2017-07-18: 117 → 13,190（+11,140%）"
        - "7564.T ワークマン 2018-10-03: 286 → 3,610（+1,161%）"
      why_it_matters: |
        除外しないと架空の利益が生まれる。実測で、低ボラティリティ戦略が 8303.T の破損値を
        掴んで CAGR 531%（総リターン +112,951,845%）という存在しない成績を出した。
        品質ゲート導入後は CAGR 1.8% に是正された。
      also: "取得時に NaN/±Infinity を弾く（allow_nan=False）。1,188銘柄中1件（8303.T）で -Infinity が混入していた"

  # =============================================================
  # 当日データ（フォワード記録用）：Yahoo Finance / yfinance — 2026-08-13 実測
  # =============================================================
  - dataset_id: same_day_quotes_yfinance
    source: Yahoo Finance（yfinance 1.3.0 / 生の chart API も利用可）
    retrieved_at: 2026-08-13
    purpose: フォワード記録の当日シグナル生成のみ。履歴研究には使わない

    # --- 実測で確認した性質 ---
    price_point_in_time: false
      # ★ Close は分割を遡って反映した値。その日実際についた値段ではない。
      #   実測: 5801 の 2026-05-21 は Yahoo=4,928 に対し J-Quants 生値=49,280（後の1:10分割を遡及適用）。
      #   なお Yahoo の値は J-Quants の AdjC（調整後）と完全一致した。齟齬ではなく定義の違い。
    universe_survivorship_free: false
      # ★ 上場廃止銘柄は取得できない。実測: 6201.T が "possibly delisted" で取得失敗。
    corporate_actions_point_in_time: false
    same_day_available: true          # ★ これが唯一かつ決定的な利点
    timezone_verified: true

    performance:
      throughput: "約50ms/銘柄（一括・並列）。674銘柄で約35秒"
      comparison: "TradingView は 5〜10秒/銘柄（674銘柄で1〜2時間）→ 100〜200倍速い"

    cross_check:
      vs_jquants: "上位10銘柄の終値を照合。9件が完全一致、1件は上記の分割調整による定義差"
      vs_tradingview: "8306 の 2026-08-13 終値 3,709 で一致"

    allowed_claims:
      - forward-looking same-day signal generation
    forbidden_claims:
      - historical backtesting                   # 分割の遡及適用でPIT性が壊れる
      - historical stock-selection performance   # 上場廃止銘柄が欠落する
      - point-in-time price level analysis       # 「当時◯円だった」という主張は不可

    known_limitations:
      - "非公式APIであり、利用規約と安定性は保証されない"
      - "履歴研究には使えない。J-Quants の生値を使うこと"

